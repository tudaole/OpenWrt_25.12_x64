name: OpenWrt_Build_2512_x64_test

permissions:
  contents: write

on:
  repository_dispatch:
  workflow_dispatch:
  #schedule:
    #- cron: 0 17 * * *

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/2512_x64_test.config
  DIY_P1_SH: diy_script/2512_x64_test_diy-part1.sh
  DIY_P2_SH: diy_script/2512_x64_test_diy-part2.sh
  FILE_NAME: OpenWrt_2512_x64_test
  PRODUCT_NAME: x86_64
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: false
  UPLOAD_RELEASE: true
  TELEGRAM_WORK_PUSH: true
  WECHAT_WORK_PUSH: true
  TZ: Asia/Shanghai

jobs:
  OpenWrt_Build_2512_x64_test:
    name: 编译OpenWrt_Build_2512_x64_test
    runs-on: ubuntu-24.04

    steps:

    - name: 检查服务器性能
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"

        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo "CPU核心数量: $(nproc)"
        echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"

        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息:"
        echo -e "$(sudo lshw -short -C memory | grep GiB)\n"

        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT


    - name: 最大化构建空间
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 8192
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'


    - name: 检出代码
      uses: actions/checkout@v4


    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e

        echo "=========================================="
        echo "初始化 OpenWrt 25.12 编译环境"
        echo "=========================================="

        sudo timedatectl set-timezone "$TZ"

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          swig \
          unzip \
          wget \
          curl \
          xsltproc \
          zstd \
          file

        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir

        echo "=========================================="
        echo "初始化完成"
        echo "=========================================="


    - name: 克隆源代码
      run: |
        df -hT $PWD

        git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt

        cd openwrt

        echo "OPENWRT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
        echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> "$GITHUB_ENV"


    - name: 缓存 OpenWrt 下载文件
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: openwrt-dl-${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ hashFiles('config/2512_x64_test.config') }}
        restore-keys: |
          openwrt-dl-${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-


    - name: 修复 intel-microcode 构建报错
      run: |
        cd openwrt

        MF=package/firmware/intel-microcode/Makefile

        if [ -f "$MF" ]; then

          awk '
            /mkdir.*intel-ucode-ipkg/ && !done {
              print "\trm -rf $(PKG_BUILD_DIR)/intel-ucode-ipkg"
              print "\tmkdir -p $(PKG_BUILD_DIR)/intel-ucode-ipkg"
              done=1
              next
            }
            { print }
          ' "$MF" > "$MF.tmp" && mv "$MF.tmp" "$MF"

          echo "===== 修复后的 Build/Compile ====="
          sed -n '/define Build\/Compile/,/^endef/p' "$MF"

        else

          echo "未找到 intel-microcode Makefile，跳过修复"

        fi


    - name: 生成变量
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config

        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV

        DEVICE_TARGET=$(cat openwrt/.config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV

        DEVICE_SUBTARGET=$(cat openwrt/.config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV


    - name: 加载自定义软件源
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default

        chmod +x $DIY_P1_SH

        cd openwrt

        $GITHUB_WORKSPACE/$DIY_P1_SH


    - name: 更新软件源
      run: cd openwrt && ./scripts/feeds update -a


    - name: 安装软件源
      run: cd openwrt && ./scripts/feeds install -a


    - name: 加载自定义配置
      run: |
        [ -e files ] && mv files openwrt/files

        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config

        chmod +x $DIY_P2_SH

        cd openwrt

        $GITHUB_WORKSPACE/$DIY_P2_SH


    - name: 修复第三方插件 apk 非法版本号
      run: |
        cd openwrt

        fix_pkg_version() {
          local mf="$1"

          [ -f "$mf" ] || return 0

          if grep -qE '^PKG_VERSION:=.*-[0-9]{8}' "$mf"; then
            echo "修复版本: $mf"

            sed -i -E 's/^(PKG_VERSION:=.*)(-)([0-9]{8})/\1.\3/' "$mf"

            grep '^PKG_VERSION' "$mf" || true
          fi

          if grep -qE '^PKG_VERSION:=.*-(beta|rbeta|alpha|rc[0-9]*)' "$mf"; then
            echo "清理 beta 后缀: $mf"

            sed -i -E 's/^(PKG_VERSION:=.*)-(beta|rbeta|alpha|rc[0-9]*)/\1/' "$mf"

            grep '^PKG_VERSION' "$mf" || true
          fi
        }

        find package -name Makefile 2>/dev/null | while read -r mf; do
          fix_pkg_version "$mf"
        done

        if [ -f package/luci-app-adguardhome/Makefile ]; then

          echo "===== luci-app-adguardhome Makefile 版本信息 ====="

          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|LUCI_VERSION)' \
            package/luci-app-adguardhome/Makefile || true

          sed -i -E \
            's/^(PKG_VERSION:=)([0-9]+\.[0-9]+)-([0-9]{8})/\1\2.\3/' \
            package/luci-app-adguardhome/Makefile

          if grep -q '1\.8-20221120' \
            package/luci-app-adguardhome/Makefile 2>/dev/null; then

            sed -i 's/1\.8-20221120/1.8.20221120/g' \
              package/luci-app-adguardhome/Makefile
          fi

          echo "===== 修复后 ====="

          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|LUCI_VERSION)' \
            package/luci-app-adguardhome/Makefile || true

        fi


    - name: 缓存工具链
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: true
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}


    - name: 下载软件包
      id: package
      run: |
        cd openwrt

        echo "=========================================="
        echo "修复 iptables 冲突"
        echo "=========================================="

        echo "禁用 iptables-zz-legacy / ip6tables-zz-legacy"
        echo "启用 iptables-nft / ip6tables-nft"

        sed -i \
          's/CONFIG_PACKAGE_iptables-zz-legacy=y/# CONFIG_PACKAGE_iptables-zz-legacy is not set/' \
          .config

        sed -i \
          's/CONFIG_PACKAGE_ip6tables-zz-legacy=y/# CONFIG_PACKAGE_ip6tables-zz-legacy is not set/' \
          .config

        sed -i \
          's/# CONFIG_PACKAGE_iptables-nft is not set/CONFIG_PACKAGE_iptables-nft=y/' \
          .config

        sed -i \
          's/# CONFIG_PACKAGE_ip6tables-nft is not set/CONFIG_PACKAGE_ip6tables-nft=y/' \
          .config

        echo "=========================================="
        echo "运行 make defconfig"
        echo "=========================================="

        make defconfig

        echo "=========================================="
        echo "defconfig 后检查 iptables 配置"
        echo "=========================================="

        grep -E '^CONFIG_PACKAGE_(iptables|ip6tables)' .config || true

        echo "=========================================="
        echo "检查 iptables-zz-legacy 配置"
        echo "=========================================="

        grep -n "iptables-zz-legacy" .config || true

        echo "=========================================="
        echo "下载 OpenWrt 软件包"
        echo "=========================================="

        make download -j$(nproc)

        echo "=========================================="
        echo "检查异常小文件"
        echo "=========================================="

        find dl -size -1024c -exec ls -l {} \;

        find dl -size -1024c -exec rm -f {} \;


    - name: 编译前检查磁盘使用情况
      if: (!cancelled())
      run: df -hT


    - name: 开始编译固件
      id: compile
      run: |
        cd openwrt

        rm -rf build_dir/target-*/intel-microcode-*

        echo "=========================================="
        echo "检查 iptables 配置"
        echo "=========================================="

        grep -E 'CONFIG_(DEFAULT_)?(IP6)?TABLES?' .config || true

        echo "=========================================="
        echo "检查 iptables-zz-legacy 配置"
        echo "=========================================="

        grep -n "iptables-zz-legacy" .config || true

        echo "=========================================="
        echo "检查现有 apk_install_list"
        echo "=========================================="

        if [ -f tmp/apk_install_list ]; then
          grep -nE 'iptables|ip6tables' tmp/apk_install_list || true
        else
          echo "tmp/apk_install_list 尚未生成"
        fi

        echo "=========================================="
        echo "搜索 iptables-zz-legacy 来源"
        echo "=========================================="

        grep -Rni "iptables-zz-legacy" \
          package feeds tmp \
          --exclude-dir=.git \
          2>/dev/null | head -200 || true

        echo "=========================================="
        echo "$(nproc) thread compile"
        echo "=========================================="

        echo "=========================================="
        echo "检查代理插件是否启用"
        echo "=========================================="

        grep -E '^CONFIG_PACKAGE_(luci-app-ssr-plus|luci-app-passwall|luci-app-passwall2)=' \
          .config || true

        make -j$(nproc) V=s

        echo "status=success" >> $GITHUB_OUTPUT

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME

        [ -s DEVICE_NAME ] && \
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV

        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV


    - name: 编译后检查磁盘使用情况
      if: (!cancelled())
      run: |
        echo "=========================================="
        echo "----------------空间使用-------------------"
        echo "=========================================="

        echo "系统空间       类型   总数  已用  可用 使用率"

        df -hT

        echo "=========================================="

        du -h --max-depth=1 openwrt/ \
          --exclude=build_dir \
          --exclude=bin

        du -h --max-depth=1 openwrt/build_dir

        du -h --max-depth=1 openwrt/bin


    - name: 上传 bin 目录
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' && !cancelled()
      with:
        name: ${{ env.FILE_NAME }}-${{ env.KERNEL }}-bin-${{ env.FILE_DATE }}
        path: openwrt/bin


    - name: 整理文件
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        echo "KERNEL=$(cat *.manifest | grep ^kernel | cut -d- -f2 | tr -d ' ')" >> $GITHUB_ENV
        mv openwrt-x86-64-generic-squashfs-combined-efi.img.gz \
          ${{ env.FILE_NAME }}-${{ env.FILE_DATE }}-uefi.img.gz
        mv openwrt-x86-64-generic-squashfs-combined.img.gz \
          ${{ env.FILE_NAME }}-${{ env.FILE_DATE }}.img.gz
        rm -rf config.buildinfo
        rm -rf feeds.buildinfo
        rm -rf openwrt-x86-64-generic-kernel.bin
        rm -rf openwrt-x86-64-generic-squashfs-rootfs.img.gz
        rm -rf openwrt-x86-64-generic.manifest
        rm -rf profiles.json
        rm -rf version.buildinfo
        rm -rf sha256sums
        rm -rf packages

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT


    - name: 上传固件目录
      uses: actions/upload-artifact@v4
      if: ${{ env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled() }}
      with:
        name: ${{ env.FILE_NAME }}-${{ env.KERNEL }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}


    - name: 生成发布标签
      id: tag
      if: ${{ env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled() }}
      run: |
        : > "$GITHUB_OUTPUT"

        release_tag=$(date +"%Y.%m.%d-%H.%M")
        release_date=$(date +"%Y-%m-%d %H:%M")

        echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
        echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "  ### 📒 固件信息 📒 ###  " >> release.txt

        echo "🎯 固件名称: ${{ env.FILE_NAME }}" > release.txt
        echo "📅 编译时间: $release_date" >> release.txt
        echo "⚙️ 构建配置: $CONFIG_FILE" >> release.txt
        echo "💻 平台架构: x86_64 " >> release.txt
        echo "🧱 固件源码: ${{ env.REPO_URL }} " >> release.txt
        echo "💝 源码分支: ${{ env.REPO_BRANCH }} " >> release.txt
        echo "🔗 最新提交: ${{ env.OPENWRT_COMMIT }} " >> release.txt
        echo "🚀 内核版本: ${{ env.KERNEL }} " >> release.txt
        echo "🌐 默认地址：192.168.1.11 " >> release.txt
        echo "🧑‍💼 默认账号：root " >> release.txt
        echo "🔑 默认密码：无密码 " >> release.txt
        echo "----------------------------------------" >> release.txt
        echo "⚽ 编译日志请查看 Actions 构建详情" >> release.txt


    - name: 上传固件至Release
      uses: softprops/action-gh-release@v3
      if: ${{ env.UPLOAD_RELEASE == 'true' && steps.tag.outputs.status == 'success' && !cancelled() }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ env.FILE_NAME }}-${{ steps.tag.outputs.release_tag }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*


    - name: 编译成功，发Telegram通知
      if: success() && env.TELEGRAM_WORK_PUSH == 'true'
      run: |
        MESSAGE=$(cat <<EOF
        🔥 固件编译完成
        🎯 固件名称: ${{ env.FILE_NAME }}
        💻 平台架构: x86_64
        🧱 固件源码: ${{ env.REPO_URL }}
        🌿 源码分支: ${{ env.REPO_BRANCH }}
        🔗 最新提交: ${{ env.OPENWRT_COMMIT }}
        🌐 默认地址: 192.168.1.11
        👤 用户名: root
        🔑 密码: 无
        📦 下载地址: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.release_tag }}
        EOF
        )

        curl -s -X POST \
          "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
          --data-urlencode "text=$MESSAGE" \
          -d "disable_web_page_preview=true"


    - name: 编译成功，发企业微信通知
      if: success() && env.WECHAT_WORK_PUSH == 'true'
      run: |
        CONTENT=$(cat <<EOF
        🔥 固件编译完成
        🎯 固件名称: ${{ env.FILE_NAME }}
        💻 平台架构: x86_64
        🧱 固件源码: ${{ env.REPO_URL }}
        🌿 源码分支: ${{ env.REPO_BRANCH }}
        🔗 最新提交: ${{ env.OPENWRT_COMMIT }}
        🌐 默认地址: 192.168.1.11
        👤 用户名: root
        🔑 密码: 无
        📦 下载地址: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.release_tag }}
        EOF
        )

        curl -s -X POST \
          "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${{ secrets.WEBHOOK_SEND_KEY }}" \
          -H "Content-Type: application/json" \
          -d "$(jq -n \
            --arg content "$CONTENT" \
            '{msgtype: "text", text: {content: $content}})"
```
