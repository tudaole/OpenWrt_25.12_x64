name: OpenWrt 25.12 x86_64 GXNAS

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  OPENWRT_COMMIT: bb9df8541c765c4a0b6e8a3ceb9a489987d5558e
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/2512_x64_test.config
  DIY_P1_SH: diy_script/2512_x64_test_diy-part1.sh
  DIY_P2_SH: diy_script/2512_x64_test_diy-part2.sh
  FILE_NAME: OpenWrt_2512_x64_test
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl xsltproc swig time jq

      - name: Clone OpenWrt and checkout fixed commit
        run: |
          git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          git fetch --no-tags --depth=1 origin "$OPENWRT_COMMIT"
          git checkout "$OPENWRT_COMMIT"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply official intel-microcode rebuild fix
        run: |
          cd openwrt
          FIX_COMMIT=$(git ls-remote "$REPO_URL" refs/heads/openwrt-25.12 | awk '{print $1}')
          git fetch --no-tags origin openwrt-25.12
          FIX_COMMIT=$(git log origin/openwrt-25.12 --format='%H' --grep='intel-microcode: fix build error on rebuild' -1)
          if [ -n "$FIX_COMMIT" ]; then
            git cherry-pick "$FIX_COMMIT"
          fi

      - name: Prepare feeds
        run: |
          [ -e "$FEEDS_CONF" ] && cp "$FEEDS_CONF" openwrt/feeds.conf.default
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run DIY part 1
        run: |
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Copy configuration
        run: |
          cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          make defconfig

      - name: Run DIY part 2
        run: |
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build OpenWrt
        run: |
          cd openwrt
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-2512-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-2512-x86_64
          path: |
            openwrt/bin/targets/x86/64/*
            !openwrt/bin/targets/x86/64/packages
          if-no-files-found: warn
